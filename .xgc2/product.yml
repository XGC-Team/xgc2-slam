schema: xgc2.product.v1
id: xgc2-slam
name: XGC2 SLAM
version: 1.1.0-10
kind: ros1-apt
summary: ROS1 SLAM packages including FAST-LIO2, Swarm-LIO2, Point-LIO, LIO-SAM, and
  Voxel-SLAM.
ros:
  distro: noetic
  packages:
  - fast_lio
  - swarm_msgs
  - udp_bridge
  - swarm_lio
  - point_lio
  - lio_sam
  - voxel_slam
  - voxelslam_pointcloud2
apt:
  distribution: focal
  install:
  - ros-noetic-xgc2-slam
  packages:
  - ros-noetic-xgc2-slam
  - ros-noetic-xgc2-fast-lio2
  - ros-noetic-xgc2-swarm-lio2
  - ros-noetic-xgc2-swarm-msgs
  - ros-noetic-xgc2-udp-bridge
  - ros-noetic-xgc2-point-lio
  - ros-noetic-xgc2-lio-sam
  - ros-noetic-xgc2-voxel-slam
  - ros-noetic-xgc2-voxelslam-pointcloud2
  depends:
  - ros-noetic-livox-ros-driver (>= 2.6.0-7)
  - ros-noetic-xgc2-fast-lio2 (>= 1.1.0-10)
  - ros-noetic-xgc2-swarm-lio2 (>= 1.1.0-10)
  - ros-noetic-xgc2-point-lio (>= 1.1.0-10)
  - ros-noetic-xgc2-lio-sam (>= 1.1.0-10)
  - ros-noetic-xgc2-voxel-slam (>= 1.1.0-10)
  - ros-noetic-xgc2-voxelslam-pointcloud2 (>= 1.1.0-10)
usage:
  install: 'sudo apt update

    sudo apt install ros-noetic-xgc2-slam

    '
  smoke_test: 'rospack find fast_lio

    rospack find swarm_lio

    rospack find point_lio

    rospack find lio_sam

    rospack find voxel_slam

    rospack find voxelslam_pointcloud2

    '
ownership:
  paths:
  - /opt/ros/noetic/share/fast_lio
  - /opt/ros/noetic/lib/fast_lio
  - /opt/ros/noetic/share/swarm_lio
  - /opt/ros/noetic/lib/swarm_lio
  - /opt/ros/noetic/share/swarm_msgs
  - /opt/ros/noetic/share/udp_bridge
  - /opt/ros/noetic/lib/udp_bridge
  - /opt/ros/noetic/share/point_lio
  - /opt/ros/noetic/lib/point_lio
  - /opt/ros/noetic/share/lio_sam
  - /opt/ros/noetic/lib/lio_sam
  - /opt/ros/noetic/share/voxel_slam
  - /opt/ros/noetic/lib/voxel_slam
  - /opt/ros/noetic/share/voxelslam_pointcloud2
  - /opt/ros/noetic/lib/voxelslam_pointcloud2
release:
  dependency_policy:
    livox-ros-driver: rebuild
