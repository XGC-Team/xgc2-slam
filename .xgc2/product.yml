schema: xgc2.product.v1
id: xgc2-slam
name: XGC2 SLAM
version: 1.2.0-1
kind: ros1-apt
summary: ROS1 SLAM aggregator. Actively maintains Faster-LIO.
ros:
  distro: noetic
  packages:
  - faster_lio
apt:
  distribution: focal
  install:
  - ros-noetic-xgc2-slam
  packages:
  - ros-noetic-xgc2-slam
  - ros-noetic-xgc2-faster-lio
  depends:
  - ros-noetic-xgc2-faster-lio (>= 1.2.0-1)
usage:
  install: 'sudo apt update

    sudo apt install ros-noetic-xgc2-slam

    '
  smoke_test: 'rospack find faster_lio

    '
ownership:
  paths:
  - /opt/ros/noetic/share/faster_lio
  - /opt/ros/noetic/lib/faster_lio
