name: release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected .xgc2/product.yml version
        required: true
        type: string
      expected_source_sha:
        description: Expected source commit SHA
        required: true
        type: string
      prepare_action:
        description: Release-train action
        required: false
        default: release
        type: choice
        options:
          - release
          - compatibility-verify
      apt_overlay_url:
        description: Optional release-scoped staging APT base URL
        required: false
        default: ""
        type: string
      dependency_set_digest:
        description: SHA256 of the resolved release-train dependency set
        required: false
        default: ""
        type: string
      run_cpp_quality:
        description: Run C++ quality checks
        required: true
        default: false
        type: boolean
      run_source_tests:
        description: Run source tests
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

env:
  XGC2_APT_OVERLAY_URL: ${{ inputs.apt_overlay_url }}
  XGC2_DEPENDENCY_SET_DIGEST: ${{ inputs.dependency_set_digest }}

jobs:
  prepare-contract:
    name: Validate prepare contract
    runs-on: ubuntu-latest
    steps:
      - name: Validate release-train inputs
        env:
          PREPARE_ACTION: ${{ inputs.prepare_action }}
          APT_OVERLAY_URL: ${{ inputs.apt_overlay_url }}
          DEPENDENCY_SET_DIGEST: ${{ inputs.dependency_set_digest }}
        run: |
          set -euo pipefail
          case "$PREPARE_ACTION" in
            release|compatibility-verify) ;;
            *)
              echo "unsupported prepare_action: $PREPARE_ACTION" >&2
              exit 1
              ;;
          esac
          if [[ -n "$DEPENDENCY_SET_DIGEST" && ! "$DEPENDENCY_SET_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "dependency_set_digest must be empty or 64 lowercase hex characters" >&2
            exit 1
          fi
          if [[ -n "$APT_OVERLAY_URL" && ! "$DEPENDENCY_SET_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "apt_overlay_url requires a dependency_set_digest" >&2
            exit 1
          fi

  validate-release-inputs:
    needs: prepare-contract
    name: Validate release inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate expected version and source SHA
        run: |
          set -euo pipefail
          actual_version="$(awk -F': *' '/^version:[[:space:]]*/ {print $2; exit}' .xgc2/product.yml)"
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_version}" != "${{ inputs.expected_version }}" ]]; then
            echo "product.yml version ${actual_version} != expected_version ${{ inputs.expected_version }}" >&2
            exit 1
          fi
          if [[ "${actual_sha}" != "${{ inputs.expected_source_sha }}" ]]; then
            echo "HEAD ${actual_sha} != expected_source_sha ${{ inputs.expected_source_sha }}" >&2
            exit 1
          fi

  package-compliance:
    name: Package compliance
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check package metadata and packaging consistency
        run: |
          git diff --check HEAD
          .xgc2/scripts/check_package_compliance.sh

  cpp-quality:
    name: C++ quality
    if: ${{ inputs.run_cpp_quality }}
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run lightweight C++ quality checks
        run: git diff --check HEAD

  source-tests:
    name: Source package checks
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    steps:
      - name: Skip source package checks
        if: ${{ !inputs.run_source_tests }}
        run: echo "Source package checks disabled by input"

      - uses: actions/checkout@v4
        if: inputs.run_source_tests
        with:
          fetch-depth: 2

      - name: Run source package checks
        if: inputs.run_source_tests
        run: |
          git diff --check HEAD
          .xgc2/scripts/check_package_compliance.sh

  deb-build:
    name: Build ${{ matrix.package-group }} (${{ matrix.arch }})
    needs: validate-release-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - package-group: fast-lio2
            arch: amd64
            runner: ubuntu-latest
          - package-group: fast-lio2
            arch: arm64
            runner: ubuntu-24.04-arm
          - package-group: faster-lio
            arch: amd64
            runner: ubuntu-latest
          - package-group: faster-lio
            arch: arm64
            runner: ubuntu-24.04-arm
          - package-group: swarm-lio2
            arch: amd64
            runner: ubuntu-latest
          - package-group: swarm-lio2
            arch: arm64
            runner: ubuntu-24.04-arm
          - package-group: point-lio
            arch: amd64
            runner: ubuntu-latest
          - package-group: point-lio
            arch: arm64
            runner: ubuntu-24.04-arm
          - package-group: lio-sam
            arch: amd64
            runner: ubuntu-latest
          - package-group: lio-sam
            arch: arm64
            runner: ubuntu-24.04-arm
          - package-group: voxel-slam
            arch: amd64
            runner: ubuntu-latest
          - package-group: voxel-slam
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Build deb packages in Docker
        env:
          SLAM_PACKAGE_GROUP: ${{ matrix.package-group }}
          SLAM_ARCH: ${{ matrix.arch }}
        run: |
          .xgc2/scripts/build_debs_in_docker.sh \
            --package-group "$SLAM_PACKAGE_GROUP" \
            --work-dir "$RUNNER_TEMP/slam-${SLAM_PACKAGE_GROUP}-${SLAM_ARCH}" \
            --output-dir "$GITHUB_WORKSPACE/debs" \
            --skip-install-check

      - name: Create release-train build manifest
        run: |
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs \
            --output-dir .ci/build-manifests \
            --product xgc2-slam \
            --product-version "${{ inputs.expected_version }}" \
            --distribution focal \
            --architecture "${{ matrix.arch }}" \
            --source-sha "${{ inputs.expected_source_sha }}" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" \
            --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
          mv ".ci/build-manifests/xgc2-slam_focal_${{ matrix.arch }}.build.json" \
            ".ci/build-manifests/xgc2-slam_${{ matrix.package-group }}_focal_${{ matrix.arch }}.build.json"

      - name: Upload deb artifacts
        if: ${{ inputs.prepare_action == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-slam-debs-${{ matrix.package-group }}-${{ matrix.arch }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true

  meta-build:
    name: Build SLAM meta packages
    needs: deb-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install meta package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot

      - name: Build meta deb packages
        env:
          SLAM_META_ARCHES: amd64 arm64
        run: |
          for arch in $SLAM_META_ARCHES; do
            mkdir -p "debs/$arch"
            .xgc2/scripts/package_debs.sh \
              --package-group meta \
              --arch "$arch" \
              --output-dir "debs/$arch"
            python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
              --deb-dir "debs/$arch" \
              --output-dir .ci/build-manifests \
              --product xgc2-slam \
              --product-version "${{ inputs.expected_version }}" \
              --distribution focal \
              --architecture "$arch" \
              --source-sha "${{ inputs.expected_source_sha }}" \
              --ci-run-id "$GITHUB_RUN_ID" \
              --ci-workflow "$GITHUB_WORKFLOW" \
              --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
            mv ".ci/build-manifests/xgc2-slam_focal_${arch}.build.json" \
              ".ci/build-manifests/xgc2-slam_meta_focal_${arch}.build.json"
          done

      - name: Upload meta artifacts
        if: ${{ inputs.prepare_action == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-slam-debs-meta
          path: |
            debs/**/*.deb
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true
