name: release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected .xgc2/product.yml version
        required: true
        type: string
      expected_source_sha:
        description: Expected source commit SHA
        required: true
        type: string
      publish_apt:
        description: Publish built debs to the XGC2 APT repository
        required: true
        default: false
        type: boolean
      run_cpp_quality:
        description: Run lightweight C++ quality checks
        required: true
        default: false
        type: boolean
      run_source_tests:
        description: Run source-tree package checks before Docker deb builds
        required: true
        default: false
        type: boolean
      release_id:
        description: Parent orchestrator run id used for correlation and audit
        required: false
        default: ""
        type: string
      release_lock_digest:
        description: SHA256 of the immutable release lock
        required: false
        default: ""
        type: string
      trusted_ci_run_id:
        description: Exact successful push CI run whose trusted deb artifacts may be reused
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate-release-inputs:
    name: Validate release inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate expected version and source SHA
        run: |
          set -euo pipefail
          actual_version="$(awk -F': *' '/^version:[[:space:]]*/ {print $2; exit}' .xgc2/product.yml)"
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_version}" != "${{ inputs.expected_version }}" ]]; then
            echo "product.yml version ${actual_version} != expected_version ${{ inputs.expected_version }}" >&2
            exit 1
          fi
          if [[ "${actual_sha}" != "${{ inputs.expected_source_sha }}" ]]; then
            echo "HEAD ${actual_sha} != expected_source_sha ${{ inputs.expected_source_sha }}" >&2
            exit 1
          fi

  package-compliance:
    name: Package compliance
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check package metadata and packaging consistency
        run: |
          git diff --check HEAD
          .xgc2/scripts/check_package_compliance.sh

  cpp-quality:
    name: C++ quality
    if: ${{ inputs.run_cpp_quality }}
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run lightweight C++ quality checks
        run: git diff --check HEAD

  source-tests:
    name: Source package checks
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    steps:
      - name: Skip source package checks
        if: ${{ !inputs.run_source_tests }}
        run: echo "Source package checks disabled by input"

      - uses: actions/checkout@v4
        if: inputs.run_source_tests
        with:
          fetch-depth: 2

      - name: Run source package checks
        if: inputs.run_source_tests
        run: |
          git diff --check HEAD
          .xgc2/scripts/check_package_compliance.sh

  deb-build:
    name: Build ${{ matrix.package-group }} (${{ matrix.arch }})
    needs: validate-release-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - package-group: fast-lio2
            arch: amd64
            runner: ubuntu-latest
          - package-group: fast-lio2
            arch: arm64
            runner: ubuntu-24.04-arm
          - package-group: swarm-lio2
            arch: amd64
            runner: ubuntu-latest
          - package-group: swarm-lio2
            arch: arm64
            runner: ubuntu-24.04-arm
          - package-group: point-lio
            arch: amd64
            runner: ubuntu-latest
          - package-group: point-lio
            arch: arm64
            runner: ubuntu-24.04-arm
          - package-group: lio-sam
            arch: amd64
            runner: ubuntu-latest
          - package-group: lio-sam
            arch: arm64
            runner: ubuntu-24.04-arm
          - package-group: voxel-slam
            arch: amd64
            runner: ubuntu-latest
          - package-group: voxel-slam
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Download trusted CI artifacts
        if: ${{ inputs.trusted_ci_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.trusted_ci_run_id }}
          name: xgc2-slam-debs-${{ matrix.package-group }}-${{ matrix.arch }}
          path: trusted

      - name: Verify and stage trusted CI artifacts
        if: ${{ inputs.trusted_ci_run_id != '' }}
        run: |
          python3 .xgc2/scripts/xgc2_artifact_manifest.py verify-build \
            --artifact-dir trusted \
            --deb-output-dir debs \
            --manifest-output-dir build-manifests \
            --product xgc2-slam \
            --product-version "${{ inputs.expected_version }}" \
            --distribution focal \
            --architecture "${{ matrix.arch }}" \
            --source-sha "${{ inputs.expected_source_sha }}" \
            --ci-run-id "${{ inputs.trusted_ci_run_id }}"

      - name: Build deb packages in Docker
        if: ${{ inputs.trusted_ci_run_id == '' }}
        env:
          SLAM_PACKAGE_GROUP: ${{ matrix.package-group }}
          SLAM_ARCH: ${{ matrix.arch }}
        run: |
          .xgc2/scripts/build_debs_in_docker.sh \
            --package-group "$SLAM_PACKAGE_GROUP" \
            --work-dir "$RUNNER_TEMP/slam-${SLAM_PACKAGE_GROUP}-${SLAM_ARCH}" \
            --output-dir "$GITHUB_WORKSPACE/debs" \
            --skip-install-check

      - name: Create fallback build manifest
        if: ${{ inputs.trusted_ci_run_id == '' }}
        run: |
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs \
            --output-dir build-manifests \
            --product xgc2-slam \
            --product-version "${{ inputs.expected_version }}" \
            --distribution focal \
            --architecture "${{ matrix.arch }}" \
            --source-sha "${{ inputs.expected_source_sha }}" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" \
            --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
          mv "build-manifests/xgc2-slam_focal_${{ matrix.arch }}.build.json" \
            "build-manifests/xgc2-slam_${{ matrix.package-group }}_focal_${{ matrix.arch }}.build.json"

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-slam-debs-${{ matrix.package-group }}-${{ matrix.arch }}
          path: |
            debs/*.deb
            build-manifests/*.json
          retention-days: 14
          include-hidden-files: true

  meta-build:
    name: Build SLAM meta packages
    needs: deb-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install meta package dependencies
        if: ${{ inputs.trusted_ci_run_id == '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot

      - name: Download trusted CI meta artifacts
        if: ${{ inputs.trusted_ci_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.trusted_ci_run_id }}
          name: xgc2-slam-debs-meta
          path: trusted

      - name: Verify and stage trusted CI meta artifacts
        if: ${{ inputs.trusted_ci_run_id != '' }}
        run: |
          for arch in amd64 arm64; do
            python3 .xgc2/scripts/xgc2_artifact_manifest.py verify-build \
              --artifact-dir trusted \
              --deb-output-dir debs \
              --manifest-output-dir build-manifests \
              --product xgc2-slam \
              --product-version "${{ inputs.expected_version }}" \
              --distribution focal \
              --architecture "$arch" \
              --source-sha "${{ inputs.expected_source_sha }}" \
              --ci-run-id "${{ inputs.trusted_ci_run_id }}"
          done

      - name: Build meta deb packages
        if: ${{ inputs.trusted_ci_run_id == '' }}
        env:
          SLAM_META_ARCHES: amd64 arm64
        run: |
          for arch in $SLAM_META_ARCHES; do
            mkdir -p "debs/$arch"
            .xgc2/scripts/package_debs.sh \
              --package-group meta \
              --arch "$arch" \
              --output-dir "debs/$arch"
            python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
              --deb-dir "debs/$arch" \
              --output-dir build-manifests \
              --product xgc2-slam \
              --product-version "${{ inputs.expected_version }}" \
              --distribution focal \
              --architecture "$arch" \
              --source-sha "${{ inputs.expected_source_sha }}" \
              --ci-run-id "$GITHUB_RUN_ID" \
              --ci-workflow "$GITHUB_WORKFLOW" \
              --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
            mv "build-manifests/xgc2-slam_focal_${arch}.build.json" \
              "build-manifests/xgc2-slam_meta_focal_${arch}.build.json"
          done

      - name: Upload meta artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-slam-debs-meta
          path: |
            debs/**/*.deb
            debs/*.deb
            build-manifests/*.json
          retention-days: 14
          include-hidden-files: true

  publish-apt:
    name: Publish APT
    if: >-
      ${{
        always() &&
        inputs.publish_apt &&
        needs.validate-release-inputs.result == 'success' &&
        needs.package-compliance.result == 'success' &&
        (needs.cpp-quality.result == 'success' || needs.cpp-quality.result == 'skipped') &&
        (needs.source-tests.result == 'success' || needs.source-tests.result == 'skipped') &&
        needs.deb-build.result == 'success' &&
        needs.meta-build.result == 'success'
      }}
    needs:
      - validate-release-inputs
      - package-compliance
      - cpp-quality
      - source-tests
      - deb-build
      - meta-build
    runs-on: ubuntu-latest
    concurrency:
      group: xgc2-apt-focal
      cancel-in-progress: false
    env:
      APT_REPO_HOST: ${{ secrets.APT_REPO_HOST }}
      APT_REPO_PORT: ${{ secrets.APT_REPO_PORT }}
      APT_REPO_SSH_KEY: ${{ secrets.APT_REPO_SSH_KEY }}
      APT_REPO_KNOWN_HOSTS: ${{ secrets.APT_REPO_KNOWN_HOSTS }}
      APT_REPO_DISTRIBUTION: focal
    steps:
      - uses: actions/checkout@v4

      - name: Download deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xgc2-slam-debs-*
          path: release-input

      - name: Validate artifacts and create release manifests
        run: |
          for artifact in release-input/*; do
            artifact_name="$(basename "$artifact")"
            python3 .xgc2/scripts/xgc2_artifact_manifest.py verify-build \
              --artifact-dir "$artifact" \
              --deb-output-dir staged/debs \
              --manifest-output-dir "staged/build-manifests/$artifact_name" \
              --product xgc2-slam \
              --product-version "${{ inputs.expected_version }}" \
              --distribution focal \
              --source-sha "${{ inputs.expected_source_sha }}"
          done
          python3 .xgc2/scripts/xgc2_artifact_manifest.py release \
            --deb-dir staged/debs \
            --build-manifest-dir staged/build-manifests \
            --publish-dir publish \
            --product xgc2-slam \
            --product-version "${{ inputs.expected_version }}" \
            --distribution focal \
            --source-sha "${{ inputs.expected_source_sha }}" \
            --release-id "${{ inputs.release_id || github.run_id }}" \
            --release-lock-digest "${{ inputs.release_lock_digest }}" \
            --target-architecture amd64 \
            --target-architecture arm64

      - name: Validate APT publish inputs
        run: |
          set -euo pipefail
          missing=()
          for name in APT_REPO_HOST APT_REPO_PORT APT_REPO_SSH_KEY APT_REPO_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'missing APT secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi
          find publish -type f -name '*.deb' -print -quit | grep -q .

      - name: Publish to self-hosted APT repository
        run: .xgc2/scripts/publish_apt_repo.sh --deb-dir publish
