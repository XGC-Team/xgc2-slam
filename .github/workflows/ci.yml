name: ci

on:
  push:
    branches:
      - noetic
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  package-compliance:
    name: Package compliance
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check package metadata and packaging consistency
        run: |
          git diff --check HEAD
          .xgc2/scripts/check_package_compliance.sh

  deb-build:
    name: Build ${{ matrix.package-group }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - package-group: fast-lio2
            arch: amd64
            runner: ubuntu-latest
          - package-group: fast-lio2
            arch: arm64
            runner: ubuntu-24.04-arm
          - package-group: swarm-lio2
            arch: amd64
            runner: ubuntu-latest
          - package-group: swarm-lio2
            arch: arm64
            runner: ubuntu-24.04-arm
          - package-group: point-lio
            arch: amd64
            runner: ubuntu-latest
          - package-group: point-lio
            arch: arm64
            runner: ubuntu-24.04-arm
          - package-group: lio-sam
            arch: amd64
            runner: ubuntu-latest
          - package-group: lio-sam
            arch: arm64
            runner: ubuntu-24.04-arm
          - package-group: voxel-slam
            arch: amd64
            runner: ubuntu-latest
          - package-group: voxel-slam
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Build deb packages in Docker
        env:
          SLAM_PACKAGE_GROUP: ${{ matrix.package-group }}
          SLAM_ARCH: ${{ matrix.arch }}
        run: |
          .xgc2/scripts/build_debs_in_docker.sh \
            --package-group "$SLAM_PACKAGE_GROUP" \
            --work-dir "$RUNNER_TEMP/slam-${SLAM_PACKAGE_GROUP}-${SLAM_ARCH}" \
            --output-dir "$GITHUB_WORKSPACE/debs" \
            --skip-install-check

      - name: Create trusted build manifest
        run: |
          product_version="$(awk -F': *' '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs \
            --output-dir .ci/build-manifests \
            --product xgc2-slam \
            --product-version "$product_version" \
            --distribution focal \
            --architecture "${{ matrix.arch }}" \
            --source-sha "$GITHUB_SHA" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" \
            --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
          mv ".ci/build-manifests/xgc2-slam_focal_${{ matrix.arch }}.build.json" \
            ".ci/build-manifests/xgc2-slam_${{ matrix.package-group }}_focal_${{ matrix.arch }}.build.json"

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-slam-debs-${{ matrix.package-group }}-${{ matrix.arch }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true

  meta-build:
    name: Build SLAM meta packages
    runs-on: ubuntu-latest
    needs: deb-build
    steps:
      - uses: actions/checkout@v4

      - name: Install meta package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot

      - name: Build meta deb packages
        env:
          SLAM_META_ARCHES: amd64 arm64
        run: |
          product_version="$(awk -F': *' '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          for arch in $SLAM_META_ARCHES; do
            mkdir -p "debs/$arch"
            .xgc2/scripts/package_debs.sh \
              --package-group meta \
              --arch "$arch" \
              --output-dir "debs/$arch"
            python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
              --deb-dir "debs/$arch" \
              --output-dir .ci/build-manifests \
              --product xgc2-slam \
              --product-version "$product_version" \
              --distribution focal \
              --architecture "$arch" \
              --source-sha "$GITHUB_SHA" \
              --ci-run-id "$GITHUB_RUN_ID" \
              --ci-workflow "$GITHUB_WORKFLOW" \
              --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
            mv ".ci/build-manifests/xgc2-slam_focal_${arch}.build.json" \
              ".ci/build-manifests/xgc2-slam_meta_focal_${arch}.build.json"
          done

      - name: Upload meta artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-slam-debs-meta
          path: |
            debs/**/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true
