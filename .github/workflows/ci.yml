name: ci

# This tree is only an aggregator. Do not CI every vendored algorithm here.
# Each algorithm repo under XGC-Team owns its own CI. The release workflow
# stays for already-published Debian artifacts.

on:
  workflow_dispatch:

jobs:
  aggregator-ci-disabled:
    name: Aggregator CI disabled
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "xgc2-slam no longer builds the full algorithm matrix."
          echo "Run CI on the individual XGC-Team algorithm repository."
