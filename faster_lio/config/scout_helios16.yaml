# XGC2 Scout Mini + RoboSense RSHELIOS 16 + serial AHRS.
# Bag topics: /rslidar_points (organized 16x1800, xyz+intensity only),
#             /imu/data_raw (200 Hz).
# The official ROBOSENSE path expects ring+timestamp fields this driver
# does not publish. First follow-up is an organized-cloud handler.
common:
  lid_topic: "/rslidar_points"
  imu_topic: "/imu/data_raw"
  time_sync_en: false
  time_offset_lidar_to_imu: 0.0

preprocess:
  lidar_type: 5
  scan_line: 16
  scan_rate: 10
  timestamp_unit: 0
  blind: 0.5

mapping:
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  fov_degree: 180
  det_range: 100.0
  extrinsic_est_en: true
  # Initial guess: unused vehicle launch put the lidar 0.307 m above base,
  # IMU coinciding with base. Calibrate before turning estimation off.
  extrinsic_T: [0.0, 0.0, 0.307]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]

publish:
  path_publish_en: true
  scan_publish_en: true
  scan_effect_pub_en: false
  dense_publish_en: false
  scan_bodyframe_pub_en: true

path_save_en: false

pcd_save:
  pcd_save_en: false
  interval: -1

feature_extract_enable: false
point_filter_num: 3
max_iteration: 3
filter_size_surf: 0.2
filter_size_map: 0.3
cube_side_length: 1000

ivox_grid_resolution: 0.2
ivox_nearby_type: 18
esti_plane_threshold: 0.1
